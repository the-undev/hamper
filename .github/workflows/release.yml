# Publishes the image for a version tag once the CI gates pass on the tagged commit, then creates its GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      packages: write
      # Creates the GitHub Release for the tag.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The same two stamps the Makefile's image target passes.
      - id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" == *-* ]] && prerelease=true || prerelease=false
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/the-undev/hamper
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            INFORMATIONAL_VERSION=${{ steps.version.outputs.version }}+${{ steps.version.outputs.sha }}

      # A 0.x version, or one with a `-`, is a pre-release on GitHub; only a `-` keeps the image off :latest.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=(--title "$TAG" --generate-notes --verify-tag)
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}"
